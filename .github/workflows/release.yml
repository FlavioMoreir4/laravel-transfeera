name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Generate changelog section
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          echo "release_name=$TAG" >> $GITHUB_OUTPUT
          # Extrai seção do changelog para esta versão
          awk -v tag="$TAG" '/^## /{if (found) exit; if ($0 ~ tag) found=1; next} found{print}' docs/changelog.md > /tmp/release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.changelog.outputs.release_name }}
          body_path: /tmp/release-notes.md
          make_latest: true
